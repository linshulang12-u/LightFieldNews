epmc:
  title: Spatiotemporal optical vortices generated by a metasurface pulse shaper carry tunable transverse orbital angular momentum
  abstract: Spatiotemporal optical vortices are structured light pulses with a phase singularity in space-time. We generate them with a metasurface pulse shaper and measure their transverse orbital angular momentum by spatiotemporal
    interferometry.
  categories:
  - Spatiotemporal Optical Vortices
  - Metasurfaces & Flat Optics
  glyph: stov
  order:
  - Spatiotemporal Optical Vortices
  - Metasurfaces & Flat Optics
