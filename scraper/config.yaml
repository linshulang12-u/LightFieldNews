# LightField News — scraper configuration (light-field control / structured light, with a spatio-?temporal column)
# Same pipeline as FemtoNews (adapted from VibraNews by ForestBin-Raman). Edit this file to change what the crawl looks for.

site:
  name: LightField News
  url: https://linshulang12-u.github.io/LightFieldNews/   # used in the bot User-Agent

http:
  user_agent: "LightFieldNewsBot/1.0 (+{site_url}; weekly literature digest)"
  timeout_s: 20
  delay_s: 1.0
  api_delay_s: 0.2
  respect_robots_txt: true

sources:
  europepmc: true
  openalex: true
  crossref: true
  arxiv: true
  max_results_per_query: 400
  max_europepmc: 6000
  max_crossref_rows: 1000
  max_openalex_per_term: 6000

# A paper is kept if its TITLE matches any include pattern, or its ABSTRACT matches one at least twice.
include:
  - 'structured[- ](light|beams?|optical fields?|light fields?|wave ?packets?|pulses?)'
  - 'optical vorti|vortex (beams?|light|pulses?|lasers?|modes?|bullets?|lens(es)?|cavit(y|ies)|arrays? of light)|vortices of light|perfect (optical )?vortex'
  - 'orbital angular momentum (of light|beams?|modes?|multiplex|states|transfer from light|light)|\bOAM\b (beams?|modes?|light|multiplex|states|channels?|communication|sorting|generation)'
  - 'spin[- ]orbit (interaction|coupling|conversion|engineering)s? (of|in) (light|optical|photon)|photonic spin hall|optical spin'
  - 'vector (beams?|vortex|vortices|optical fields?|light fields?|light)|cylindrical vector|radially polari[sz]ed|azimuthally polari[sz]ed|Poincar[eé] (beams?|sphere beams?)|polari[sz]ation singularit|C-points?|V-points?'
  - 'Bessel(-Gauss(ian)?)?(-X)? beams?|Airy (beams?|pulses?|wave ?packets?)|non-?diffracting|frozen waves?|self-?accelerating|self-?healing (beams?|light)|autofocusing beams?|Mathieu (beams?|wave)|Pearcey|optical needle|bottle beams?'
  - 'optical skyrmion|skyrmion(ic)? (beams?|light|textures? of light|topolog(y|ies) of light)|optical hopfion|hopfions? of light|optical (knots?|links?|merons?|braids?)|topological (light|structured light|quasiparticles? of light|light fields?)'
  - 'Laguerre[- ]Gauss|Hermite[- ]Gauss|Ince[- ]Gauss|higher-order (optical )?modes? of light'
  - 'wave-?front shaping|transmission matrix|optical phase conjugation|focusing (light )?through scattering|light (transport|control) (in|through) (scattering|disordered|opaque)'
  - 'spatial light modulator|digital micromirror|computer-generated hologra|phase-only hologra|holographic (beam|field|light[- ]field|optical tweezers)|meta-?hologra'
  - 'metasurfaces?\W+(\w+\W+){0,6}(beams?|vorti|vortex|polari[sz]ation|wavefront|hologra|light[- ]fields?|focusing|structured)'
  - '(beam|wavefront|light[- ]field|optical field|pulse) (shaping|engineering|sculpting|tailoring)|light[- ]field (manipulation|control|modulation|regulation)|optical field (manipulation|control|regulation)'
  - 'tight(ly)? focus(ed|ing) (beams?|vector|vortex|light|fields?|structured)|focal fields? (engineering|shaping|structure)|longitudinal (electric )?field component'
  - 'optical (spanners?|conveyors?|tractor beams?)|optical (trapping|tweezers|manipulation|forces?|torques?)\W+(\w+\W+){0,5}(structured|vortex|vector|Bessel|Airy|orbital angular|spin angular|skyrmion|hologra|Laguerre)'
  - 'spatio-?temporal (optical )?vorti|\bSTOVs?\b|space-?time (wave ?packets?|light sheets?|structured|vorti|beams?)|transverse orbital angular momentum'
  - 'spatio-?temporal(ly)? (structured (light|pulses?|beams?|fields?)|shaped (pulses?|light|beams?)|sculpt\w* (of )?light|light|optical|wave ?packets?|pulses?|beams?|focusing|mode-?lock\w*|solitons?|metasurfaces?|photonic|Laguerre|Hermite|Bessel|Airy|spherical Gaussian|skyrmions?|topological (light|pulses?|combs?|wave)|vector (pulses?|beams?|fields?)|Stokes|metalattices?|pulse shaping|shaping of (light|pulses?))|spatio-?temporal(ly)? (coupled|coupling|synchroni\w*) (pulses?|modes?|solitons?|light)'
  - 'toroidal (light |electromagnetic )?pulses?|flying (doughnuts?|donuts?|focus)|supertoroidal|light bullets?|optical bullets?|vortex bullets?|X-?waves?|focus wave modes?|localized waves?'
  - 'tunable group velocit|arbitrary group velocit|superluminal (pulses?|wave)|subluminal (pulses?|wave)|pulse[- ]front tilt|temporal focusing'
  - 'time-?varying (media|medium|metamaterials?|photonic|metasurfaces?|optical systems?|flat optics)|spatio-?temporal(ly)? modulat\w* (of )?(the )?(refractive|permittivity|metasurfaces?|surfaces?|interfaces?|media|medium|waveguides?)|moving (interfaces?|mirrors?) (for|of|in) (light|optics|waves)|synthetic (motion|velocit\w*)|temporal (interfaces?|boundar(y|ies)|reflection|refraction|slits?)|photonic time crystals?|time refraction|time reflection|temporal chirality'
  - 'mode (decomposition|sorting|multiplexing|demultiplexing)|multi-?plane light conversion|\bMPLC\b|photonic lanterns?|OAM (multiplex|demultiplex|sorting|detection|recognition)'
  - 'partially coherent (beams?|vortex|vortices|structured|vector|light)|coherence (engineering|structured|singularit\w*|vortex|vortices)|twisted (partially coherent|Gaussian Schell)|Gaussian Schell'
  - 'diffractive (deep )?neural networks?|\bD2NN\b|optical diffractive (network|processor)'
  - 'Pancharatnam|geometric[- ]phase (element|optics|metasurface|lens|device)|q-?plates?|spiral phase plate|fork gratings?|axicons?'

# Names specific enough that ONE mention in the abstract is enough
strong_include:
  - 'structured light'
  - 'optical vorti'
  - 'vortex beams?'
  - 'orbital angular momentum of light'
  - 'cylindrical vector beams?'
  - 'vector (vortex )?beams?'
  - 'Bessel(-Gauss)? beams?'
  - 'Airy beams?'
  - 'optical skyrmion'
  - 'optical hopfion'
  - 'spatio-?temporal optical vortex'
  - 'space-?time wave ?packets?'
  - 'toroidal (light )?pulses?'
  - 'light bullets?'
  - 'wave-?front shaping'
  - 'spatial light modulator'
  - 'phase-only hologra'
  - 'temporal focusing'
  - 'photonic time crystal'
  - 'Laguerre[- ]Gaussian (beams?|modes?)'

# Generic terms count only in the TITLE
title_only: []   # every include pattern is already specific; generic words never count on their own

characterisation_list: '(?:\b(?:XRD|XPS|SEM|TEM|EDS|AFM|Raman|FTIR)\b\s*(?:,|/|;|\band\b)\s*){2,}(?:\band\s+)?\b(?:XRD|XPS|SEM|TEM|EDS|AFM|Raman|FTIR)\b'

exclude_sources: ['zenodo', 'figshare', 'mendeley data', 'dryad', 'harvard dataverse', 'pangaea']

extra_topics:
  - name: Adaptive optics and beam control
    title:
      - 'adaptive optics\W+(\w+\W+){0,6}(beams?|lasers?|focus|wavefront|light)'
      - 'wavefront (sensing|correction)\W+(\w+\W+){0,4}(beams?|lasers?|structured)'
    abstract:
      - 'structured illumination fields?'
    exclude: ['telescope', 'astronom', 'retina', 'ophthalm']

core_journals:
  issn: []
  titles: []

max_age_days: 180

# Drop a paper if its title or abstract matches any of these
exclude:
  - '\b(acoustic|acoustics|ultrasound|ultrasonic|seismic|sonic)\b|elastic waves?|water waves?|sound waves?'
  - 'magnetic skyrmions?|skyrmion (bubbles?|hall)|chiral magnets?|magnons?|spin textures? in (ferro|antiferro|magnet)'
  - 'electron (vortex|vortices|beams?)|neutron|free-?electron|electron diffraction|matter-?wave|Bose-Einstein|superfluid|quantized vorti|superconduct|Abrikosov'
  - '(fluid|flow|fluids|hydrodynamic|aerodynamic|wake|shedding|cyclone|typhoon|tornado|horseshoe|scour) (vortex|vortices)|vortex (shedding|induced vibration|generators?|ring dynamics in fluid)|bluff body|cavitating'
  - 'wireless|antennas?|transmitarray|reflectarray|microwave|millimeter-?wave|radio[- ]frequency|\bMIMO\b|\b6G\b|radar'
  - 'gravitational|black holes?|astrophys|galax(y|ies)|tokamak|magnetohydrodynamic'
  - 'precipitation|traffic|epidemi|spatio-?temporal (analysis|patterns?|distribution|data|forecast|graph|attention|transformer|network|heterogeneity|variation|dynamics of (cell|tumou?r|populations?)|evolution of (the )?(agricultur|urban|economic|land))'
  - 'phototheranost|photodynamic therap|photothermal therap|proton (beam )?therapy|radiotherapy|beamlines?|synchrotron|X-ray free-electron|optical flow\b|conformal field theory|light operators|gait\b|crime|mosquito|greenhouse gas|supply chain|logistics|delivery management|data cent(er|re)s?|digital twins?'

technique:
  terms:
    - 'structured light|optical vorti|vortex beam|orbital angular momentum|vector (vortex )?beam|cylindrical vector|Bessel(-Gauss(ian)?)? beam|Airy (beam|pulse|wave)|optical skyrmion|skyrmion(ic)? (beam|light|field)|hopfion|spatio-?temporal (optical|light|wave ?packet|pulse|vorti|focusing|mode-?lock)|space-?time wave|toroidal pulse|light bullet|wave-?front shaping|spatial light modulator|metasurface|hologra|Laguerre|Poincar[eé] (beam|sphere)|topological charge|temporal focusing|time-varying (media|medium|metamaterial|metasurface|photonic)'
  cues:
    - '\b(we|here,? we|this work|this paper)\s+(\w+\s+){0,3}(develop|demonstrat|present|introduc|report|propos|realiz|build|construct|design|invent|achiev|generat|observ)\w*\s+(\S+\s+){0,8}?(generation|generator|method|platform|scheme|device|metasurface|technique|approach|strategy|framework|system|encoder|detector|laser|source|modulator|architecture|processor)'
  strong_cues:
    - '\b(we|here,? we|this work)\s+(\w+\s+){0,2}(develop|demonstrat|present|introduc|report|propos|realiz|invent)\w*\s+(a|an|the first)\s+(\S+\s+){0,6}?(method|technique|strategy|approach|platform|system|scheme|device|metasurface|generator|encoder|detector|laser|source|architecture|processor|framework)\b'
    - '\b(first (experimental )?(demonstration|observation|realization|generation)|experimentally (demonstrat|observ|realiz)\w*|record|orders? of magnitude|unprecedented)\b'
  journals: ['^optica\b', 'optics express', 'optics letters', 'light: science', 'nature photonics', 'nature communications', 'nature physics', 'science advances', 'physical review letters', 'advanced photonics', 'apl photonics', '^elight', 'photonix', 'laser & photonics', 'nanophotonics', 'acs photonics', 'photonics research', 'opto-electronic advances', 'journal of optics', 'journal of the optical society', 'optics communications', 'optics and lasers in engineering', 'optics & laser technology', 'advanced optical materials', 'physical review a', 'physical review applied', 'chinese optics letters', 'ultrafast science', 'communications physics', 'npj nanophotonics']

routine_application:
  domain: []
  method: []

# Every kept paper must say something optical (after the include rules have matched). Stops generic
# "spatiotemporal" / "time-varying" papers from other fields. Core journals and inbox DOIs skip this.
require_any:
  - '\b(light|optical|optics|photonic\w*|lasers?|beams?|wave-?fronts?|polari[sz]\w+|metasurfaces?|wavelengths?|fib(er|re)s?|hologra\w*|lens(es)?|pulses?|vorti\w*|vortex|interferen\w*|diffract\w*|SLM|terahertz|photons?|plasmon\w*|spectral|electromagnetic|waves?|permittivity|refractive)\b'

exclude_title:
  - '^comment on\b|^reply to\b|^erratum|^correction|call for papers|editorial board|issue information'
  - 'light[- ]field (cameras?|displays?|imaging|microscop\w*|rendering|video|compression|depth|images?|reconstruction|3D|super-resolution)|plenoptic'
  - 'structured[- ]light (3D|three-dimensional|sensors?|scann\w*|profil\w*|measur\w*|projection|projector|systems?|cameras?|reconstruction|depth|vision|illumination)|fringe projection|phase unwrapping|phase[- ]shifting profilometry|profilometry|3D (shape |surface )?(measurement|reconstruction|scanning)'

soft_exclude:
  patterns:
    - 'single-molecule force spectroscopy|force spectroscopy|chromosome|protein folding|DNA (pulling|stretching)|cell mechanics'
  unless_title: ['vortex', 'Bessel', 'Airy', 'vector beam', 'structured', 'holographic', 'orbital', 'spin', 'skyrmion', 'Laguerre', 'tractor', 'spanner']

